{% extends "store/base_store.html" %}
{% block tieu_de %}{{ 'Đăng ký' if tab == 'dang_ky' else 'Đăng nhập' }}{% endblock %}
{% block noi_dung %}

<section class="auth-wrap">
  <div class="container">
    <div class="auth-box">
      <div class="auth-tabs">
        <a href="{{ url_for('dang_nhap', next=request.args.get('next')) }}" class="{{ 'active' if tab != 'dang_ky' }}">Đăng nhập</a>
        <a href="{{ url_for('dang_ky', next=request.args.get('next')) }}" class="{{ 'active' if tab == 'dang_ky' }}">Đăng ký</a>
      </div>

      {% if tab == 'dang_ky' %}
      <form method="post" action="{{ url_for('dang_ky', next=request.args.get('next')) }}">
        <div class="form-group">
          <label for="ho_ten">Họ và tên *</label>
          <input type="text" id="ho_ten" name="ho_ten" class="form-control" value="{{ form.get('ho_ten', '') }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="ten_dang_nhap">Tên đăng nhập *</label>
          <input type="text" id="ten_dang_nhap" name="ten_dang_nhap" class="form-control" value="{{ form.get('ten_dang_nhap', '') }}" placeholder="Ví dụ: minhquan99" required>
        </div>
        <div class="form-group">
          <label for="sdt">Số điện thoại *</label>
          <input type="text" id="sdt" name="sdt" class="form-control" value="{{ form.get('sdt', '') }}" placeholder="09xxxxxxxx" required>
        </div>
        <div class="form-group">
          <label for="dia_chi">Địa chỉ nhận hàng</label>
          <input type="text" id="dia_chi" name="dia_chi" class="form-control" value="{{ form.get('dia_chi', '') }}" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành">
        </div>
        <div class="form-group">
          <label for="mat_khau">Mật khẩu * (tối thiểu 6 ký tự)</label>
          <div class="pw-wrap">
            <input type="password" id="mat_khau" name="mat_khau" class="form-control" minlength="6" required>
            <button type="button" class="pw-toggle" data-pw-toggle="mat_khau" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-black btn-block">Tạo tài khoản khách hàng</button>
      </form>
      {% else %}
      <form method="post" action="{{ url_for('dang_nhap', next=request.args.get('next')) }}">
        <div class="form-group">
          <label for="ten_dang_nhap">Tên đăng nhập *</label>
          <input type="text" id="ten_dang_nhap" name="ten_dang_nhap" class="form-control" required autofocus autocomplete="username" placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
          <label for="mat_khau">Mật khẩu *</label>
          <div class="pw-wrap">
            <input type="password" id="mat_khau" name="mat_khau" class="form-control" required autocomplete="current-password" placeholder="Nhập mật khẩu">
            <button type="button" class="pw-toggle" data-pw-toggle="mat_khau" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-black btn-block">Đăng nhập</button>
      </form>

      <details class="demo-box" open>
        <summary>Chọn nhanh tài khoản demo 3 vai trò (bấm để tự điền)</summary>
        <div class="demo-list">
          <button type="button" class="demo-pick" data-demo-user="admin" data-demo-pass="demo-password">
            <span><strong>Quản trị viên (ADMIN)</strong> — Toàn quyền /admin</span>
            <code>admin</code>
          </button>
          <button type="button" class="demo-pick" data-demo-user="nv001" data-demo-pass="demo-password">
            <span><strong>Nhân viên (NV)</strong> — Đơn hàng &amp; Kho /admin</span>
            <code>nv001</code>
          </button>
          <button type="button" class="demo-pick" data-demo-user="kh0001" data-demo-pass="demo-password">
            <span><strong>Khách hàng (KH)</strong> — Mua sắm &amp; Theo dõi đơn</span>
            <code>kh0001</code>
          </button>
        </div>
      </details>
      {% endif %}
    </div>
  </div>
</section>

{% endblock %}
