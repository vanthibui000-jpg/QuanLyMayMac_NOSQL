{% extends "base.html" %}
{% block tieu_de %}Lập đơn đặt hàng{% endblock %}
{% block noi_dung %}
<form method="post" class="the" id="form-don">
  <div class="dong-dau" style="margin-bottom:18px">
    <div>
      <label for="ma_kh">Khách hàng</label>
      <select name="ma_kh" id="ma_kh" required>
        <option value="">-- chọn khách hàng --</option>
        {% for kh in khach %}
          <option value="{{ kh._id }}">{{ kh._id }} — {{ kh.ten_kh }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="the-tieu-de">
    <h2>Dòng hàng</h2>
    <button type="button" class="nut-phu nut-nho" id="them-dong">+ Thêm dòng</button>
  </div>
  <p class="phu" style="margin-top:-6px">Chọn sản phẩm, rồi bấm màu và size. Dòng để trống sẽ bị bỏ qua. Đơn giá lấy từ sản phẩm tại thời điểm đặt.</p>

  <div id="ds-dong"></div>

  <div class="tong-tam">
    <span class="phu">Tạm tính</span>
    <strong id="tong-tam">0 ₫</strong>
  </div>

  <p style="margin-top:18px;text-align:right"><button type="submit">Tạo đơn hàng</button></p>
</form>

<template id="mau-dong">
  <div class="dong-hang">
    <select name="ma_sp" class="chon-sp" aria-label="Sản phẩm">
      <option value="">-- chọn sản phẩm --</option>
      {% for sp in tuy_chon_sp %}
        <option value="{{ sp.id }}">{{ sp.id }} — {{ sp.ten }}</option>
      {% endfor %}
    </select>
    <div class="nhom-chip" data-loai="mau"><span class="chip-trong">Chọn sản phẩm trước</span></div>
    <div class="nhom-chip" data-loai="size"></div>
    <input type="number" name="so_luong" class="so-luong" min="1" step="1" placeholder="SL" aria-label="Số lượng">
    <span class="thanh-tien">0 ₫</span>
    <button type="button" class="nut-xoa" aria-label="Xóa dòng">×</button>
    <input type="hidden" name="mau" value="">
    <input type="hidden" name="size" value="">
  </div>
</template>

{% endblock %}

{% block scripts %}
<script id="du-lieu-sp" type="application/json">{{ tuy_chon_sp|tojson }}</script>
<script src="{{ url_for('static', filename='js/don_hang_moi.js') }}"></script>
{% endblock %}
