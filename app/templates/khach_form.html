{% extends "base.html" %}
{% block tieu_de %}{{ 'Thêm khách hàng' if la_moi else 'Sửa khách hàng ' ~ kh._id }}{% endblock %}
{% block noi_dung %}
<form method="post" class="the" style="max-width:640px">
  <h2>{{ 'Thông tin khách hàng mới' if la_moi else 'Thông tin khách hàng' }}</h2>
  {% if not la_moi %}<p class="ghi-chu-form">Mã {{ kh._id }} không đổi.</p>{% endif %}

  <div class="truong">
    <label class="nhan-form" for="ten_kh">Tên khách hàng / cửa hàng *</label>
    <input type="text" id="ten_kh" name="ten_kh" value="{{ kh.ten_kh or '' }}" required maxlength="120">
  </div>
  <div class="truong">
    <label class="nhan-form" for="sdt">Số điện thoại *</label>
    <input type="tel" id="sdt" name="sdt" value="{{ kh.sdt or '' }}" required maxlength="15" placeholder="0900000001">
  </div>

  <div class="hang-ngang">
    <button type="submit">Lưu</button>
    <a class="nut nut-phu" href="{{ url_for('ds_khach_hang') }}">Hủy</a>
  </div>
</form>
{% endblock %}
